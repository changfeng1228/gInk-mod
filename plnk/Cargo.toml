[package]
name = "plnk"
version = "0.2.4"
edition = "2024"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# Runtime dependency: the Microsoft `windows` crate is the only allowed
# dependency (plan §7). Feature flags are limited to the namespaces used by the
# native platform/graphics layer:
# - Foundation, LibraryLoader, Com, Threading: HWND/HINSTANCE/HANDLE and COM
#   apartment lifetime for DirectComposition.
# - Direct3D/Direct3D11/Dxgi(+Common): the D3D11 device that backs Direct2D and
#   the DXGI composition swap chain.
# - Direct2D(+Common), DirectComposition: drawing and DWM-driven visual
#   animations.
# - Dwm: composition/presentation timestamps for the 240Hz gate measurement.
# - Gdi: screen pixel sampling in the gate probe.
# - Imaging: WIC decoding of the original gInk PNG toolbar assets into D2D.
# - HiDpi, WindowsAndMessaging: window creation, per-monitor-v2 DPI and the
#   routed-input acceptance test.
# - ProcessStatus, Performance: memory/CPU measurements and the monotonic
#   clock in the gate probe.
# - Security: the `CreateMutexW` signature names `SECURITY_ATTRIBUTES`; the
#   single-instance guard passes a null attributes pointer but still needs the
#   namespace to compile.
# - UI_Input_KeyboardAndMouse: `RegisterHotKey`/`UnregisterHotKey` and the
#   `MOD_*`/`VK_*` constants for the global hotkeys, plus `mouse_event` in the
#   desktop acceptance test.
# - UI_Input_Pointer: `WM_POINTER` handling — `GetPointerInfo`,
#   `GetPointerType`, `GetPointerPenInfoHistory`/`GetPointerTouchInfoHistory`/
#   `GetPointerInfoHistory` (coalesced history), `POINTER_INFO`/`POINTER_PEN_INFO`
#   and the pen flags/masks needed for pressure and the eraser end (plan §6.3).
# - UI_Shell: `Shell_NotifyIconW` and `NOTIFYICONDATAW` for the tray icon.
#
# `windows-numerics` is not a new runtime dependency: it is already compiled as
# part of the `windows` crate's mandatory dependency tree, and the Direct2D
# method signatures (`DrawLine`, `D2D1_ELLIPSE`, geometry sinks, transforms)
# name its `Vector2`/`Matrix3x2` types directly. Declaring the exact same
# version merely makes those types nameable; no additional code or binary size
# is added.
[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_DirectComposition", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Security", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-numerics = "0.3.1"
